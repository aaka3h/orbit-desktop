name: Feature request
description: Suggest an improvement to Orbit.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe what you are trying to do and what makes it difficult today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Desired solution
      description: Explain the behavior you would like, with an example if useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Describe other approaches or workarounds you have tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Add examples or mockups. Do not include credentials or private information.
